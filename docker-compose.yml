services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gis_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: gis_user
      POSTGRES_PASSWORD: gis_password
      POSTGRES_DB: gis_change_detection
    ports:
      # Đổi cổng host nếu máy đã có Postgres khác chiếm 5432: POSTGIS_PORT=5433 docker compose up -d
      - "${POSTGIS_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_user -d gis_change_detection"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: gis_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gis_user:gis_password@db:5432/gis_change_detection
      CONTRACTS_DIR: /contracts
      PROCESSED_DIR: /data/processed
      # Tự nạp contracts/mock/ khi DB còn trống. Tuần 7 chuyển sang dữ liệu thật:
      #   docker compose exec api python scripts/seed.py --source /data/processed
      AUTO_SEED: "true"
      SEED_SOURCE: /contracts/mock
      UVICORN_RELOAD: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      - ./contracts:/contracts:ro
      - ./data/processed:/data/processed:ro

volumes:
  postgis_data:
